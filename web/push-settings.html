<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BikeHunt 推送配置</title><style>body{font-family:"Microsoft YaHei",sans-serif;background:#f5f5f7;color:#202329;padding:24px}main{max-width:600px;margin:30px auto;background:white;padding:32px;border-radius:20px}h1{font-size:26px}p,li{line-height:1.9;font-size:15px;color:#65707b}input{width:100%;box-sizing:border-box;font-size:16px;border:1px solid #ddd;padding:13px;border-radius:10px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:#0069e0;color:white;font-size:16px}a{color:#0069e0}#status{font-size:14px;margin-top:16px}label{display:block;margin:22px 0 10px}</style></head><body><main><h1>个人微信提醒配置</h1><p>管理员完成一次配置后，用户从 BikeHunt 的“微信提醒”入口扫码绑定。</p><ol><li>在 <a href="https://wxpusher.zjiecode.com/admin/" target="_blank" rel="noopener noreferrer">个人推送服务后台</a> 开通应用。</li><li>在此填写应用 AppToken，只保存在电脑私有配置中。</li><li>用户扫码绑定，并在接收端启用微信通道。</li></ol><p>此设置须在电脑本机地址 <a href="http://127.0.0.1:18888/web/push-settings.html">127.0.0.1</a> 打开。密钥不会显示在公开商品接口。</p><form id="settings"><label for="token">应用 AppToken</label><input type="password" id="token" autocomplete="off" required placeholder="AT_…"><button>保存配置</button><div id="status" role="status"></div></form><p>服务当前支持的微信接收通道及授权要求，以该服务实际设置为准；配置完成不等于已确认微信送达。</p></main><script>document.getElementById('settings').onsubmit=async event=>{event.preventDefault();const status=document.getElementById('status');try{const response=await fetch('/api/admin/push-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app_token:document.getElementById('token').value.trim()})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'保存失败');document.getElementById('token').value='';status.textContent='已保存。回到 BikeHunt 点击微信提醒，扫码绑定。'}catch(error){status.textContent=error.message}};</script></body></html>
