<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BikeHunt 微信群配置</title><style>body{font-family:system-ui,'Microsoft YaHei',sans-serif;max-width:610px;margin:45px auto;padding:0 20px;background:#f5f6f8;color:#202631;line-height:1.8}h1{font-size:26px}label{display:block;margin:20px 0 8px}input,button{box-sizing:border-box;font:inherit;border:1px solid #d9dee5;border-radius:9px;padding:12px;width:100%;background:#fff}button{background:#0069e0;color:white;border:0;margin-top:26px;cursor:pointer}p{font-size:14px;color:#758090}img{width:220px;height:220px;object-fit:contain;display:block;margin:20px auto}a{color:#0069e0}</style></head><body><h1>微信群交流入口</h1><p>只允许在电脑本机保存。用户从网页扫码入群，群内由微信群进行交流。</p><label for="title">群名称</label><input id="title" value="骑游海淘交流群" maxlength="60"><label for="image">选择实际微信群二维码（PNG / JPG，最大 1.5 MB）</label><input id="image" type="file" accept="image/png,image/jpeg"><img id="preview" alt="所选群二维码预览" hidden><label for="expiry">二维码有效期（必填，按微信显示的日期保守填写）</label><input id="expiry" type="datetime-local" required><button id="save" type="button">保存并显示在“加入骑游海淘交流群”入口</button><p id="status" role="status"></p><p>到期后网站会停止展示旧二维码。更新群二维码后，在此重新保存即可。</p><a href="/web/">返回 BikeHunt</a><script>let imageData='';document.getElementById('image').onchange=event=>{const file=event.target.files[0];if(!file)return;if(file.size>1500000){document.getElementById('status').textContent='图片超过 1.5 MB';return}const reader=new FileReader();reader.onload=()=>{imageData=String(reader.result);const preview=document.getElementById('preview');preview.src=imageData;preview.hidden=false};reader.readAsDataURL(file)};document.getElementById('save').onclick=async()=>{const button=document.getElementById('save');const status=document.getElementById('status');button.disabled=true;try{if(!imageData)throw new Error('请先选择实际微信群二维码');const expiry=document.getElementById('expiry').value;const response=await fetch('/api/admin/community',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.getElementById('title').value,image_data:imageData,expires_at:expiry?new Date(expiry).toISOString():null})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'保存失败');status.textContent='已保存，用户可在“加入骑游海淘交流群”入口查看并扫码入群。'}catch(error){status.textContent=error.message}finally{button.disabled=false}};</script></body></html>
