name: Restore existing public snapshot
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bikehunt-pages
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/site-restore-20261104
          path: restored-site
          persist-credentials: false
      - name: Verify preserved data integrity
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('restored-site')
          manifest=json.loads((root/'data/publication.json').read_bytes())
          for key in ('snapshot','status'):
              record=manifest[key]
              data=(root/record['path']).read_bytes()
              assert len(data)==record['bytes'] and hashlib.sha256(data).hexdigest()==record['sha256'], key
          PY
          rm -rf restored-site/.git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: restored-bikehunt-${{ github.run_id }}
          path: restored-site
      - name: Restore Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: restored-bikehunt-${{ github.run_id }}
