name: Validate collection repair
on:
  push:
    branches: [codex/fix-catalog-retention]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test_catalog_retention_regression.py'
      - run: python -m playwright install --with-deps chromium
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/offers
            data/rules
            data/fx_latest.json
            data/public_updates.json
            data/publication_cache
            data/source_deferrals
          key: bikehunt-public-data-v2-39357432651-1
          fail-on-cache-miss: true
      - run: python scripts/check_catalog_health.py --capture --before /tmp/catalog-before.json
      - run: python scripts/collect_offers.py
      - name: Compare against last published catalog
        run: python scripts/check_catalog_health.py --before /tmp/catalog-before.json
      - name: Describe any missing families
        if: failure()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.check_catalog_health import capture,inspect
          path=Path('/tmp/catalog-before.json')
          if not path.exists(): raise SystemExit(0)
          before=json.loads(path.read_text()); after=capture()
          old={r['product_id']:r for r in before['cards']}; new={r['product_id']:r for r in after['cards']}
          print('REPRO_REPORT',json.dumps(inspect(before,after),ensure_ascii=False))
          for key in sorted(set(old)-set(new)):
              card=old[key]; oid=card.get('reference_offer_id'); prev=before['offers'].get(oid,{}); curr=after['offers'].get(oid,{})
              matches=[{k:r.get(k) for k in ('product_id','name','brand','color','stock_state','category_group')} for r in new.values() if r.get('name')==card.get('name') and r.get('brand')==card.get('brand')]
              fields=('offer_id','name','source_code','url','identity','family_hint','fetched_at','stock','collection_state','data_kind')
              print('REPRO_FAMILY',json.dumps({'card':card,'previous':{k:prev.get(k) for k in fields},'current':{k:curr.get(k) for k in fields},'matches':matches},ensure_ascii=False))
          PY
