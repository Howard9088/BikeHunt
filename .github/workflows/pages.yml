name: Publish BikeHunt Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '8,23,38,53 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bikehunt-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BIKEHUNT_PUBLIC_URL: https://howard9088.github.io/BikeHunt/
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install crawler and test dependencies
        run: pip install -r requirements-dev.txt
      - name: Restore first public listing receipts
        uses: actions/cache/restore@v6
        with:
          path: data/listing_receipts/ledger.json
          key: bikehunt-public-listings-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bikehunt-public-listings-v1-
      - name: Validate core modules
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate published snapshot freshness
        run: node scripts/test_pages_freshness.js
      - name: Validate private-data-free visitor counter
        run: node scripts/test_visitor_stats.js
      - name: Validate purchase safety and visible labels
        run: node scripts/test_purchase_safety.js
      - name: Validate visual final external exit safety
        run: node scripts/test_external_exit.js
      - name: Validate exact bundle selection and stock combinations
        run: node scripts/test_bundle_selection.js
      - name: Validate ordered routes and registration safety
        run: node scripts/test_route_flow.js
      - name: Validate stock expiry and open purchase flows
        run: node scripts/test_stock_guards.js
      - name: Validate stable group QR expiry and loading safeguards
        run: node scripts/test_group.js
      - name: Validate five-group browsing and official research safety
        run: node scripts/test_browse_groups.js
      - name: Validate scoped browsing and price messages
        run: node scripts/test_catalog_messages.js
      - name: Validate verified featured deals and exact discount quotes
        run: node scripts/test_featured_deals.js
      - name: Verify first public listing order and Beijing time
        run: node scripts/test_listing_order.js
      - name: Validate read-only merchant language guides
        run: node scripts/test_merchant_guides.js
      - name: Validate complete merchant and market payment matrices
        run: node scripts/test_payment_methods.js
      - name: Validate purchase readiness and forwarding references
        run: node scripts/test_purchase_readiness.js
      - name: Validate real registration screenshot scope and trusted assets
        run: |
          node scripts/test_registration_guides.js
          python scripts/verify_registration_guides.py
      - name: Install Chromium for dynamic collection and browser regression
        timeout-minutes: 5
        run: python -m playwright install --with-deps chromium
      - name: Validate desktop and mobile five-group browsing
        if: github.event_name == 'push'
        timeout-minutes: 3
        run: python scripts/test_browse_groups_ui.py
      - name: Validate actual JavaScript-rendered inventory capture
        run: python scripts/test_dynamic_browser.py
      - name: Validate desktop and mobile purchase reference UI
        if: github.event_name == 'push'
        timeout-minutes: 3
        run: python scripts/test_catalog_messages_ui.py
      - name: Validate conditional cost preview on desktop and mobile
        if: github.event_name == 'push'
        timeout-minutes: 3
        run: python scripts/test_cost_preview_ui.py
      - name: Validate stable group entrance on desktop and mobile
        if: github.event_name == 'push'
        timeout-minutes: 3
        run: python scripts/test_group_ui.py
      - name: Validate featured discounts and ordinary search on desktop and mobile
        if: github.event_name == 'push'
        timeout-minutes: 3
        run: python scripts/test_featured_deals_ui.py
      - name: Validate merchant guide focus and navigation on desktop and mobile
        if: github.event_name == 'push'
        timeout-minutes: 3
        run: python scripts/test_merchant_guides_ui.py
      - name: Validate real registration screenshots on desktop and mobile
        if: github.event_name == 'push'
        timeout-minutes: 3
        run: python scripts/test_registration_guides_ui.py
      - name: Validate scoped payment matrices on desktop and mobile
        if: github.event_name == 'push'
        timeout-minutes: 3
        run: python scripts/test_payment_methods_ui.py
      - name: Validate purchase readiness on desktop and mobile
        if: github.event_name == 'push'
        timeout-minutes: 3
        run: python scripts/test_purchase_readiness_ui.py
      - name: Validate ordered purchase stages on desktop and mobile
        if: github.event_name == 'push'
        timeout-minutes: 3
        run: python scripts/test_route_flow_ui.py
      - name: Validate bundle selectors and exact purchase restoration
        if: github.event_name == 'push'
        timeout-minutes: 3
        run: python scripts/test_bundle_selection_ui.py
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/offers
            data/rules
            data/fx_latest.json
            data/public_updates.json
            data/publication_cache
            data/source_deferrals
          key: bikehunt-public-data-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bikehunt-public-data-v2-
      - name: Restore public event cursor
        run: python scripts/seed_updates.py
      - name: Collect public prices and stocks
        run: python scripts/collect_offers.py
      - name: Check policy changes once daily
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          from app.policies import collect_rules
          import json
          root = Path.cwd()
          dates = [datetime.fromisoformat(json.loads(p.read_text())['checked_at']) for p in (root/'data/rules').glob('*.json')]
          if not dates or datetime.now(timezone.utc)-min(dates) >= timedelta(days=1):
              print(json.dumps(collect_rules(root), ensure_ascii=False))
          PY
      - name: Build public interactive website
        run: python scripts/build_pages.py
      - name: Validate exact payment assets before deployment
        run: python scripts/verify_payment_methods.py --local-dir _site
      - name: Validate built manifest and market labels before deployment
        run: python scripts/verify_public_release.py --local-dir _site
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            data/offers
            data/rules
            data/fx_latest.json
            data/public_updates.json
            data/publication_cache
            data/source_deferrals
          key: bikehunt-public-data-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: bikehunt-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bikehunt-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify public release receipt
        run: python scripts/verify_public_release.py --record-listings
      - name: Persist successfully verified first listing receipts
        uses: actions/cache/save@v6
        with:
          path: data/listing_receipts/ledger.json
          key: bikehunt-public-listings-v1-${{ github.run_id }}-${{ github.run_attempt }}
